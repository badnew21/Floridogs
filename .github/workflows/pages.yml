name: Deploy to GitHub Pages

# The game is plain static files, so the whole repository is the site.
on:
  push:
    branches: [claude/nintogs-ds-scooby-cherry-nw96n0, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages must be enabled once by hand: Settings -> Pages -> Source: GitHub Actions.
      # The Actions token is not allowed to turn it on.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
